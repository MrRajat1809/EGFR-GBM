# Run HADDOCK from this system directory; input paths are relative to it.
run_dir = "run"

molecules = [
    "input/C240Y_ECD_clean_A.pdb",
    "input/Nimotuzumab_Fab_500.pdb"
]

########################################
# 0) Topology
########################################
[topoaa]

########################################
# 1) Rigid-body docking (it0)
########################################
[rigidbody]
ambig_fname = "restraints/ambig_nimo.tbl"
sampling = 500

########################################
# 2) Score/evaluate it0 models
########################################
[caprieval]

########################################
# 3) Select best it0 models for refinement
########################################
[seletop]
select = 200

########################################
# 4) Semi-flexible refinement (it1)
########################################
[flexref]
ambig_fname = "restraints/ambig_nimo.tbl"

########################################
# 5) Score/evaluate refined models
########################################
[caprieval]

########################################
# 6) Select best refined models for clustering
########################################
[seletop]
select = 100

########################################
# 7) Cluster by FCC
########################################
[clustfcc]

########################################
# 8) Pick top clusters and representatives
########################################
[seletopclusts]

########################################
# 9) Score/evaluate the final clusters
########################################
[caprieval]
